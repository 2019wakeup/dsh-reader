name: Release to npm

# Conventional, token-short flow: the publish credential lives only in the
# repository secret `NPM_TOKEN`; nothing is stored on a developer machine.
# The tag must match dsh-reader/package.json#version.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm provenance attestation and, later, Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-reader
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: dsh-reader/pnpm-lock.yaml

      # npm >= 11.5.1 understands OIDC Trusted Publishing, so the same workflow
      # keeps working after the token is removed.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm eval

      - name: Require the tag to match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (pkg.version !== tag) {
              console.error('tag v' + tag + ' does not match package version ' + pkg.version);
              process.exit(1);
            }
          "

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
